
services:
  # =================================
  # 1. PHP + APACHE
  # =================================
  php:
    build: ./php
    container_name: webdev_php
    ports:
      - "8080:80"
    volumes:
      - ./php/src:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # =================================
  # 2. PYTHON REST API
  # =================================
  python-api:
    build: ./python
    container_name: webdev_python_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./python:/app
    restart: unless-stopped

  # =================================
  # 3. PYTHON WEBSOCKET
  # =================================
  websocket:
    build: ./python
    container_name: webdev_websocket
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - ./python:/app
    restart: unless-stopped

  # =================================
  # 4. NODE.JS FRONTEND
  # =================================
  frontend:
    image: node:22-alpine
    container_name: webdev_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

  # =================================
  # 5. MYSQL DATABASE
  # =================================
  mysql:
    image: mysql:8.4
    container_name: webdev_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # =================================
  # 6. POSTGRESQL DATABASE
  # =================================
  postgres:
    image: postgres:17
    container_name: webdev_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # =================================
  # 7. MONGODB DATABASE
  # =================================
  mongodb:
    image: mongo:8
    container_name: webdev_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  # =================================
  # 8. PHPMYADMIN
  # =================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webdev_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # =================================
  # 9. PGADMIN
  # =================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webdev_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  # =================================
  # 10. MONGO EXPRESS
  # =================================
  mongo-express:
    image: mongo-express:latest
    container_name: webdev_mongo_express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    ports:
      - "8082:8081"
    depends_on:
      - mongodb
    restart: unless-stopped

  # =================================
  # 11. MQTT MOSQUITTO
  # =================================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: webdev_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # =================================
  # 12. RABBITMQ
  # =================================
  rabbitmq:
    image: rabbitmq:4-management
    container_name: webdev_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

# =================================
# PERSISTENT VOLUMES
# =================================
volumes:
  mysql_data:
  postgres_data:
  mongodb_data:
  pgadmin_data:
  rabbitmq_data:
  frontend_node_modules:
